# =========================================================================
# PMLOGGER CONFIGURATION FILE
# Targets: RAPL (Power/Energy), CPU Utilization, and Memory Usage
# Also records Container-specific Metrics to enable Power Attribution Calcs
# =========================================================================

# 1. Mandatory metadata logging (Captured once at startup)
log advisory on once {
        hinv
        kernel.uname
        filesys.mountdir
        filesys.uuid
        filesys.type
        filesys.blocksize
        filesys.capacity
}

# 2. Continuous Metric Collection (Sampled every 1 second)
log advisory on 1 sec {
    # ---------------------------------------------------------------------
    # ⚡ DENKI RAPL METRICS (Power & Energy Consumption)
    # ---------------------------------------------------------------------
    # Total energy consumed by the RAPL domains (Joules)
    denki.rapl.energy
    
    # Power consumption rate calculated by PCP (Watts)
    denki.rapl.rate
    
    # Optional breakdown per hardware component (Packages, Cores, DRAM)
    denki.rapl.rate.package
    denki.rapl.rate.cores
    denki.rapl.rate.dram

    # ---------------------------------------------------------------------
    # 🧠 CPU UTILIZATION METRICS
    # ---------------------------------------------------------------------
    # Aggregated breakdown of all CPU cores combined (User, System, Idle, etc.)
    kernel.all.cpu.user
    kernel.all.cpu.sys
    kernel.all.cpu.nice
    kernel.all.cpu.intr
    kernel.all.cpu.wait
    kernel.all.cpu.idle
    
    # System load average (1, 5, and 15-minute intervals)
    kernel.all.load

    # ---------------------------------------------------------------------
    # 💾 MEMORY USAGE METRICS
    # ---------------------------------------------------------------------
    # Total physical memory on the system (Kbytes)
    mem.physmem
    
    # Available (free) physical memory (Kbytes)
    mem.util.free
    
    # Cached memory and memory used for buffers (Kbytes)
    mem.util.cached
    mem.util.bufmem
    
    # Virtual memory swap space usage (Kbytes)
    mem.util.swapFree
    mem.util.swapTotal

    # 📦 CONTAINER-SPECIFIC METRICS (via cgroups) 
    # CPU usage per container (nanoseconds of CPU time consumed) 
    cgroup.cpuacct.usage 

    # Memory usage per container (Bytes used) 
    cgroup.memory.usage_in_bytes 
    cgroup.memory.stat
}
